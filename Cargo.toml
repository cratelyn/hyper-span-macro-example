[package]
name = "hyper-span-macro-example"
description = "See https://github.com/hyperium/hyper/pull/4231."
authors = ["git@katelyn.world"]
version = "0.1.0"
edition = "2024"

[features]
default = ["tracing"]
tracing = ["dep:tracing"]

[dependencies]
tokio = { version = "1", features = [
    "fs",
    "macros",
    "net",
    "io-std",
    "io-util",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "test-util",
] }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-subscriber = "0.3"
